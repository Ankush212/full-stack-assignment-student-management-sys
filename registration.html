<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Student Portal</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="registration.html" class="active">Registration</a>
            <a href="result.html">Result</a>
        </div>
    </nav>

    <div class="container">
        <div class="registration-box">
            <h1>Student Registration</h1>
            <p class="subtitle">Enter your details and subject marks</p>

            <form id="registration-form">

                <div class="form-group">
                    <label for="fullname">Student Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}"
                        maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select your course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="M.Sc">M.Sc</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="10" max="100" placeholder="Enter your age" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-options">
                        <label>
                            <input type="radio" name="gender" value="Male" required>
                            Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter your complete address"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Enter your city" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" placeholder="Enter your state" required>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6"
                        placeholder="6-digit pincode" required>
                </div>

                <h2 class="marks-heading">Enter Subject Marks</h2>
                <p class="subtitle">Enter marks out of 100 for each subject.</p>

                <div class="form-group">
                    <label for="subject1">Subject 1</label>
                    <input type="number" id="subject1" name="subject1" min="0" max="100" step="1"
                        placeholder="Marks out of 100" required>
                </div>

                <div class="form-group">
                    <label for="subject2">Subject 2</label>
                    <input type="number" id="subject2" name="subject2" min="0" max="100" step="1"
                        placeholder="Marks out of 100" required>
                </div>

                <div class="form-group">
                    <label for="subject3">Subject 3</label>
                    <input type="number" id="subject3" name="subject3" min="0" max="100" step="1"
                        placeholder="Marks out of 100" required>
                </div>

                <div class="form-group">
                    <label for="subject4">Subject 4</label>
                    <input type="number" id="subject4" name="subject4" min="0" max="100" step="1"
                        placeholder="Marks out of 100" required>
                </div>

                <div class="form-group">
                    <label for="subject5">Subject 5</label>
                    <input type="number" id="subject5" name="subject5" min="0" max="100" step="1"
                        placeholder="Marks out of 100" required>
                </div>

                <button type="submit" class="submit-btn">
                    Register Student
                </button>

                <div id="registration-message" aria-live="polite"></div>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
