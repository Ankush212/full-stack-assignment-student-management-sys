<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Student Portal</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="registration.html">Registration</a>
            <a href="result.html" class="active">Result</a>
        </div>
    </nav>

    <div class="result-container">
        <div class="result-box">
            <h1>Check Result</h1>
            <p>Enter your Student ID and course to view your result.</p>

            <form id="result-form">
                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" placeholder="Enter your Student ID" required>
                </div>

                <div class="form-group">
                    <label for="result-course">Course</label>
                    <select id="result-course" required>
                        <option value="">Select Course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="M.Sc">M.Sc</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">
                    Check Result
                </button>

                <div id="result-message" aria-live="polite"></div>
            </form>

            <div id="result-output"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
